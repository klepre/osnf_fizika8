<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lovci na svetlobo</title>
<style>
:root{--bg:#04060d;--panel:#0c1224;--panel2:#121a33;--line:#283463;--text:#f1f5ff;--muted:#a9b7df;--red:#ff3b5c;--green:#39ff88;--cyan:#3fe0ff;--yellow:#ffd23f;--violet:#c58cff}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1000px 500px at 50% -10%,rgba(63,224,255,.12),transparent 70%),radial-gradient(800px 400px at 100% 100%,rgba(255,59,92,.08),transparent 70%);pointer-events:none;z-index:-1}
svg.defs{position:absolute;width:0;height:0;overflow:hidden}
header#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.45rem 1rem;background:rgba(4,6,13,.94);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.15rem;color:var(--cyan);text-shadow:0 0 12px rgba(63,224,255,.7);cursor:pointer;white-space:nowrap;background:none;border:0;padding:0}
#scorebar{display:flex;gap:.5rem;flex-wrap:wrap;flex:1;justify-content:center;align-items:center}
.tools{display:flex;gap:.35rem;flex-wrap:wrap}
.tbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.3rem .65rem;font-size:.8rem;min-height:40px;font-weight:700;cursor:pointer}
.tbtn:hover{border-color:var(--cyan)}
.tbtn.on{border-color:var(--green);color:var(--green)}
main#app{max-width:1180px;margin:0 auto;padding:1rem 1rem 4rem}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:1.2rem 1.4rem;box-shadow:0 10px 40px rgba(0,0,0,.45);margin-bottom:1rem}
h1,h2,h3{margin:.2rem 0 .6rem;line-height:1.2}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
p{margin:.4rem 0}
.muted{color:var(--muted)}
button{font-family:inherit}
.btn{border:2px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:.65rem 1.15rem;font-size:1rem;font-weight:700;min-height:54px;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 14px rgba(63,224,255,.35)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,#26e086,#13a65e);border-color:#7dffb7;color:#02150b}
.btn.laser{background:linear-gradient(180deg,#ff4f6c,#d41d40);border-color:#ff9aac;color:#fff}
.btn.violet{border-color:var(--violet);color:#e7d6ff}
.btn.ghost{background:transparent}
.btn.small{min-height:42px;padding:.35rem .8rem;font-size:.85rem}
.btn.tiny{min-height:34px;min-width:34px;padding:0 .3rem;border-radius:9px;font-size:1rem}
.pill{display:inline-block;padding:.25rem .7rem;border-radius:999px;background:#0a1130;border:1px solid var(--line);font-weight:700;font-size:.9rem;margin:.15rem}
.pill.prop{border-color:var(--yellow);color:var(--yellow)}
/* hero */
.hero{text-align:center;padding-top:1rem}
.hero h1{font-size:3.2rem;letter-spacing:1px;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,59,92,.45))}
.hero .story{max-width:820px;margin:0 auto 1rem;font-size:1.1rem;color:#d9e2ff}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;max-width:900px;margin:1rem auto}
.mode{padding:1.2rem;text-align:left;min-height:120px}
.mode b{display:block;font-size:1.35rem;margin-bottom:.3rem}
.mode span{font-weight:500;color:var(--muted);font-size:.95rem}
.machine{margin:.4rem 0}
.machine svg{width:100%;height:auto;display:block}
/* stage map */
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.9rem;margin-top:1rem}
.scard{text-align:left;display:flex;flex-direction:column;gap:.2rem;min-height:140px;padding:.9rem 1rem}
.scard .num{font-size:.85rem;color:var(--muted);font-weight:700}
.scard .ttl{font-size:1.2rem}
.scard .st{font-size:.85rem;color:var(--muted);font-weight:600;margin-top:auto}
.scard.lit{border-color:var(--green);box-shadow:0 0 16px rgba(57,255,136,.25)}
.scard.lit .st{color:var(--green)}
.scard.final{border-color:var(--yellow)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.fact{border:1px solid rgba(255,210,63,.55);background:rgba(255,210,63,.08);border-radius:14px;padding:.9rem 1.1rem;margin:.8rem 0;font-size:1.1rem}
.fact b{color:var(--yellow)}
/* task */
.taskhead{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.4rem}
.stagetag{font-weight:800;color:var(--cyan)}
.dots{display:flex;gap:.35rem}
.dots i{width:16px;height:16px;border-radius:50%;background:#1a2346;border:2px solid #34407a;display:inline-block}
.dots i.cur{border-color:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.dots i.ok{background:var(--green);border-color:var(--green)}
.dots i.half{background:var(--yellow);border-color:var(--yellow)}
.dots i.bad{background:var(--red);border-color:var(--red)}
.q{font-size:1.35rem;font-weight:700;margin:.3rem 0 .5rem}
.q b{color:var(--yellow)}
.fig{background:#060a16;border:1px solid var(--line);border-radius:14px;padding:.3rem;margin:.6rem 0}
.fig svg{width:100%;height:auto;display:block;max-height:60vh}
.fig.small svg{max-height:42vh}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:.7rem;margin-top:.7rem}
.opts.yn{grid-template-columns:repeat(2,minmax(160px,1fr));max-width:620px}
.opt{text-align:left;font-weight:600;font-size:1.05rem}
.opts.yn .opt{text-align:center;font-size:1.5rem}
.right{border-color:var(--green)!important;background:rgba(57,255,136,.14)!important;box-shadow:0 0 18px rgba(57,255,136,.35)}
.wrong{border-color:var(--red)!important;background:rgba(255,59,92,.12)!important}
.msg{padding:.7rem 1rem;border-radius:12px;margin-top:.8rem;font-size:1.05rem;border:2px solid}
.msg.ok{border-color:var(--green);background:rgba(57,255,136,.1)}
.msg.bad{border-color:var(--red);background:rgba(255,59,92,.1)}
.msg.hint{border-color:var(--yellow);background:rgba(255,210,63,.09)}
.msg.info{border-color:var(--cyan);background:rgba(63,224,255,.08)}
.expl{margin-top:1rem;border:2px solid rgba(197,140,255,.6);background:rgba(197,140,255,.08);border-radius:14px;padding:.9rem 1.1rem}
.expl p{font-size:1.08rem}
.hidden{display:none!important}
.actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:flex-end;margin-top:1rem}
.award{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.award:empty{display:none}
/* sort */
.sorthint{color:var(--muted);font-size:.9rem;margin:.2rem 0 .5rem}
.pool{min-height:80px;display:flex;flex-wrap:wrap;gap:.55rem;padding:.7rem;border:2px dashed var(--line);border-radius:14px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem;margin-top:.8rem}
.bucket{border:2px solid var(--line);border-radius:14px;min-height:150px;padding:.6rem;background:rgba(255,255,255,.02);cursor:pointer}
.bucket.b0{border-color:rgba(255,210,63,.6)}
.bucket.b1{border-color:rgba(63,224,255,.6)}
.bhead{font-weight:800;font-size:1.15rem;margin-bottom:.4rem}
.blist{display:flex;flex-wrap:wrap;gap:.5rem;min-height:90px}
.chip{background:#18224a;border:2px solid #3d4d8c;border-radius:12px;padding:.5rem .85rem;font-weight:700;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;position:relative;font-size:1.02rem}
.chip svg{width:52px;height:96px;display:block}
.chip.dragging{z-index:50;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.6);cursor:grabbing}
.chip.sel{border-color:var(--yellow);box-shadow:0 0 14px rgba(255,210,63,.5)}
.chip.locked{cursor:default}
/* num */
.numrow{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:.45rem 0;padding:.45rem .7rem;border-radius:12px;border:2px solid transparent}
.nlab{font-weight:700;min-width:12rem;font-size:1.1rem}
.ninp{font-size:1.4rem;width:8.5rem;padding:.4rem .6rem;border-radius:10px;border:2px solid var(--line);background:#050914;color:var(--text);text-align:center;font-weight:700}
.ninp:focus{outline:none;border-color:var(--cyan)}
.nunit{font-size:1.2rem;font-weight:700;color:var(--muted)}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.segb{min-height:46px;font-size:.98rem}
.segb.sel{border-color:var(--yellow);color:var(--yellow)}
/* laser etc */
.laserctrl{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center;justify-content:center}
.mctrl{display:flex;align-items:center;gap:.4rem;background:#0a1130;border:1px solid var(--line);border-radius:14px;padding:.3rem .5rem}
.mctrl span{font-weight:800;margin:0 .3rem}
.rot{min-width:64px;font-size:1.5rem;padding:.2rem .6rem}
.readout{text-align:center;margin-top:.5rem;font-weight:700;color:var(--muted);min-height:1.5em}
.rangerow{display:flex;align-items:center;gap:.8rem;margin:.3rem 0;font-weight:700}
.rangerow input{flex:1;height:36px;accent-color:#ffd23f}
.benchinfo{text-align:center;margin:.3rem 0}
.goals{margin-top:.6rem}
.goalrow{padding:.45rem .7rem;border-radius:10px;margin:.3rem 0;border:2px solid transparent;font-size:1.08rem}
.goalrow.cur{border-color:var(--yellow);background:rgba(255,210,63,.07)}
.goalrow.done{color:var(--green)}
.goalrow b{color:var(--yellow)}
.ask{margin-top:.8rem;border-top:1px solid var(--line);padding-top:.6rem}
.eyebtns{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.4rem}
.eyebtns .btn.sel{border-color:var(--yellow)}
.status{text-align:center;font-weight:700;font-size:1.1rem;margin-top:.4rem;min-height:1.5em}
.matchtbl{display:grid;grid-template-columns:minmax(150px,1fr) minmax(160px,1fr) minmax(260px,2fr);gap:.5rem;align-items:center;margin-top:.6rem}
.matchtbl .mh{font-weight:800;color:var(--muted)}
.matchtbl .mn{font-weight:800;font-size:1.15rem}
.matchtbl select{font-size:1rem;padding:.55rem;border-radius:10px;background:#050914;color:var(--text);border:2px solid var(--line);min-height:50px;width:100%;font-weight:600}
/* final */
.levelbar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.lvl{font-weight:800;padding:.25rem .7rem;border-radius:999px;border:2px solid}
.lvl.l1{border-color:var(--green);color:var(--green)}
.lvl.l2{border-color:var(--yellow);color:var(--yellow)}
.lvl.l3{border-color:var(--red);color:var(--red)}
.timerwrap{display:flex;align-items:center;gap:.6rem;margin:.5rem 0}
.timer{flex:1;height:16px;background:#111a35;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yellow),var(--green));transition:width .1s linear}
.tleft{font-weight:800;font-size:1.3rem;min-width:3.5rem;text-align:right}
/* teams */
.team{display:flex;align-items:center;gap:.35rem;border:2px solid var(--tc);border-radius:12px;padding:.15rem .35rem .15rem .65rem;background:rgba(255,255,255,.03)}
.team .tn{font-weight:700;font-size:.85rem;max-width:11rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .ts{font-size:1.3rem;color:var(--tc);min-width:2.2ch;text-align:right}
.teamsetup{display:grid;gap:.6rem;max-width:600px}
.teamsetup input{font-size:1.1rem;padding:.55rem .7rem;border-radius:10px;background:#050914;color:var(--text);border:2px solid var(--tc,var(--line));width:100%;font-weight:700}
.cnt .btn.sel{border-color:var(--yellow);color:var(--yellow)}
ul.learn{font-size:1.12rem}
ul.learn li{margin:.35rem 0}
table.res{width:100%;border-collapse:collapse;margin:.5rem 0}
table.res td,table.res th{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left}
table.res td.r{text-align:right;font-weight:800}
.big{font-size:2.6rem;font-weight:900;color:var(--green);text-shadow:0 0 18px rgba(57,255,136,.5)}
.grow{stroke-dasharray:1;stroke-dashoffset:1;animation:grow .7s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.grow{animation:none;stroke-dashoffset:0}.pop{animation:none}}
@media (max-width:720px){html{font-size:17px}.hero h1{font-size:2.3rem}.nlab{min-width:0}.matchtbl{grid-template-columns:1fr}.matchtbl .mh{display:none}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs>
<filter id="glow" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="8000" height="8000"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowBig" filterUnits="userSpaceOnUse" x="-3000" y="-3000" width="8000" height="8000"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs></svg>
<header id="top">
  <button class="brand" id="brand" type="button">⚡ Lovci na svetlobo</button>
  <div id="scorebar"></div>
  <div class="tools">
    <button class="tbtn" id="bMenu" type="button">☰ Meni</button>
    <button class="tbtn" id="bSound" type="button">🔇 Zvok</button>
    <button class="tbtn" id="bSmaller" type="button" aria-label="Manjša pisava">A−</button>
    <button class="tbtn" id="bBigger" type="button" aria-label="Večja pisava">A+</button>
    <button class="tbtn" id="bFull" type="button" aria-label="Celozaslonski način">⛶</button>
  </div>
</header>
<main id="app"></main>
<script>
'use strict';
/* ================= osnovno ================= */
const RED='#ff3b5c',GREEN='#39ff88',CYAN='#3fe0ff',YEL='#ffd23f',VIO='#c58cff',ORANGE='#ff9f43',WHITE='#eef3ff',MUTED='#7f8fb8',DARK='#05070f',SILVER='#d6e6ff';
const TEAM_COLORS=['#ff3b5c','#39ff88','#3fe0ff','#ffd23f'];
const DEFAULT_TEAMS=['Rdeči laserji','Zeleni žarki','Modri snopi','Rumene iskre'];
const SKEY='lovci-na-svetlobo-v1';
const S={mode:null,teams:[],progress:{},wrong:{},sound:false,fs:1};

const $=(s,r=document)=>r.querySelector(s);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function btn(label,cls,fn){const b=el('button','btn '+(cls||''),label);b.type='button';if(fn)b.addEventListener('click',fn);return b;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function fmt(x){const r=Math.round(x*100)/100;return String(r).replace('.',',');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const cross=(a,b)=>a.x*b.y-a.y*b.x;
function svgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SKEY)||'null');if(d&&typeof d==='object')Object.assign(S,d);}catch(e){}}
let actx=null;
function beep(type){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    const f={ok:[660,1100],bad:[260,150],click:[600,600],win:[523,1568]}[type]||[440,440];
    o.type='sine';o.frequency.setValueAtTime(f[0],t);o.frequency.exponentialRampToValueAtTime(f[1],t+0.2);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.14,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+0.3);
  }catch(e){}
}

/* ================= SVG pomočniki ================= */
function svgWrap(w,h,inner,extra){return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" ${extra||''}>${inner}</svg>`;}
function bg(w,h){return `<rect width="${w}" height="${h}" fill="#060a16"/>`;}
function n1(v){return (+v).toFixed(1);}
function T(x,y,s,o){o=o||{};return `<text x="${n1(x)}" y="${n1(y)}" fill="${o.c||WHITE}" font-size="${o.size||20}" font-weight="${o.w||700}" text-anchor="${o.anchor||'middle'}" style="paint-order:stroke;stroke:${DARK};stroke-width:5px;stroke-linejoin:round">${s}</text>`;}
function arcPath(cx,cy,r,a1,a2){
  const x1=cx+r*Math.cos(rad(a1)),y1=cy+r*Math.sin(rad(a1)),x2=cx+r*Math.cos(rad(a2)),y2=cy+r*Math.sin(rad(a2));
  return `M${n1(x1)} ${n1(y1)} A${r} ${r} 0 ${Math.abs(a2-a1)>180?1:0} ${a2>a1?1:0} ${n1(x2)} ${n1(y2)}`;
}
function arc(cx,cy,r,a1,a2,c,w){return `<path d="${arcPath(cx,cy,r,a1,a2)}" fill="none" stroke="${c||YEL}" stroke-width="${w||3}"/>`;}
function ahead(x1,y1,x2,y2,c){
  const mx=(x1+x2)/2,my=(y1+y2)/2,a=Math.atan2(y2-y1,x2-x1),s=11;
  const p=[[mx+s*Math.cos(a),my+s*Math.sin(a)],[mx+s*Math.cos(a+2.5),my+s*Math.sin(a+2.5)],[mx+s*Math.cos(a-2.5),my+s*Math.sin(a-2.5)]];
  return `<polygon points="${p.map(q=>n1(q[0])+','+n1(q[1])).join(' ')}" fill="${c}"/>`;
}
function beam(x1,y1,x2,y2,c,o){
  o=o||{};
  let s=`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${c}" stroke-width="${o.w||4}" stroke-linecap="round" ${o.dash?`stroke-dasharray="${o.dash}"`:''} ${o.glow===false?'':'filter="url(#glow)"'} ${o.grow?'pathLength="1" class="grow"':''} ${o.op?`opacity="${o.op}"`:''}/>`;
  if(o.arrow&&Math.hypot(x2-x1,y2-y1)>40) s+=ahead(x1,y1,x2,y2,c);
  return s;
}
function dashed(x1,y1,x2,y2,c,w){return beam(x1,y1,x2,y2,c,{dash:'8 8',glow:false,w:w||2});}
function lensShape(x,cy,hh,kind){
  if(kind==='conv') return `<path d="M${x} ${cy-hh} Q${x+34} ${cy} ${x} ${cy+hh} Q${x-34} ${cy} ${x} ${cy-hh}Z" fill="rgba(63,224,255,.16)" stroke="${CYAN}" stroke-width="3"/>`;
  return `<path d="M${x-16} ${cy-hh} L${x+16} ${cy-hh} Q${x+1} ${cy} ${x+16} ${cy+hh} L${x-16} ${cy+hh} Q${x-1} ${cy} ${x-16} ${cy-hh}Z" fill="rgba(63,224,255,.16)" stroke="${CYAN}" stroke-width="3"/>`;
}
function vArrow(x,y0,y1,c,dash){
  const dir=y1<y0?-1:1;const len=Math.abs(y1-y0);if(len<2)return '';
  const hs=Math.min(14,len*0.45);
  return `<line x1="${n1(x)}" y1="${n1(y0)}" x2="${n1(x)}" y2="${n1(y1-dir*hs*0.6)}" stroke="${c}" stroke-width="5" ${dash?'stroke-dasharray="8 6"':''} stroke-linecap="round"/><polygon points="${n1(x)},${n1(y1)} ${n1(x-hs*0.7)},${n1(y1-dir*hs)} ${n1(x+hs*0.7)},${n1(y1-dir*hs)}" fill="${c}" ${dash?'opacity=".8"':''}/>`;
}
function lensProfile(d){return `<svg viewBox="0 0 60 110"><path d="${d}" fill="rgba(63,224,255,.28)" stroke="#3fe0ff" stroke-width="3"/></svg>`;}

/* --- scena z lečo: trije značilni žarki --- */
function lensScene(p){
  const {kind,a,h,sx,sy,L,W,H}=p,ay=p.axisY,fd=Math.abs(p.f);
  const X=x=>L+x*sx,Y=y=>ay-y*sy;
  const xR=(W-L)/sx+1;
  const cid='clip'+Math.random().toString(36).slice(2,8);
  let s=`<defs><clipPath id="${cid}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
  s+=`<line x1="0" y1="${ay}" x2="${W}" y2="${ay}" stroke="${MUTED}" stroke-width="2" stroke-dasharray="10 7"/>`;
  s+=lensShape(L,ay,H/2-14,kind);
  [[-fd,'F'],[fd,'F′']].forEach(([x,l])=>{s+=`<circle cx="${n1(X(x))}" cy="${ay}" r="6" fill="${YEL}"/>`+T(X(x),ay+30,l,{c:YEL,size:20});});
  if(kind==='conv')[[-2*fd,'2F'],[2*fd,'2F′']].forEach(([x,l])=>{if(X(x)>12&&X(x)<W-12)s+=`<circle cx="${n1(X(x))}" cy="${ay}" r="4" fill="${MUTED}"/>`+T(X(x),ay+30,l,{c:MUTED,size:16});});
  const O={x:-a,y:h};
  const ext=(P,Q,xe)=>{const t=(xe-P.x)/(Q.x-P.x);return {x:xe,y:P.y+(Q.y-P.y)*t};};
  const seg=(P,Q,c,o)=>beam(X(P.x),Y(P.y),X(Q.x),Y(Q.y),c,o);
  const dseg=(P,Q,c)=>dashed(X(P.x),Y(P.y),X(Q.x),Y(Q.y),c);
  const C1=RED,C2=GREEN,C3=VIO;
  let g='',b=null,hi=null,real=null;
  if(kind==='conv'){
    if(Math.abs(a-fd)>1e-6){b=a*fd/(a-fd);hi=-h*b/a;real=b>0;}
    g+=seg(O,{x:0,y:h},C1,{arrow:true});
    g+=seg({x:0,y:h},ext({x:0,y:h},{x:fd,y:0},xR),C1,{arrow:true});
    g+=seg(O,{x:0,y:0},C2,{arrow:true});
    g+=seg({x:0,y:0},ext(O,{x:0,y:0},xR),C2,{arrow:true});
    if(a>fd+1e-6){const y3=-h*fd/(a-fd);g+=seg(O,{x:0,y:y3},C3,{arrow:true});g+=seg({x:0,y:y3},{x:xR,y:y3},C3,{arrow:true});}
    else if(a<fd-1e-6){
      const y3=h*fd/(fd-a);
      g+=beam(X(-fd),Y(0),X(O.x),Y(O.y),C3,{dash:'3 7',glow:false,w:2});
      g+=seg(O,{x:0,y:y3},C3,{arrow:true});g+=seg({x:0,y:y3},{x:xR,y:y3},C3,{arrow:true});
      g+=dseg({x:0,y:h},{x:b,y:hi},C1)+dseg({x:0,y:0},{x:b,y:hi},C2)+dseg({x:0,y:y3},{x:b,y:hi},C3);
    }
  }else{
    b=-a*fd/(a+fd);hi=h*fd/(a+fd);real=false;
    g+=seg(O,{x:0,y:h},C1,{arrow:true});
    g+=seg({x:0,y:h},ext({x:-fd,y:0},{x:0,y:h},xR),C1,{arrow:true});
    g+=dseg({x:0,y:h},{x:-fd,y:0},C1);
    g+=seg(O,{x:0,y:0},C2,{arrow:true});g+=seg({x:0,y:0},ext(O,{x:0,y:0},xR),C2,{arrow:true});
    const y3=h*fd/(a+fd);
    g+=seg(O,{x:0,y:y3},C3,{arrow:true});g+=seg({x:0,y:y3},{x:xR,y:y3},C3,{arrow:true});
    g+=beam(X(0),Y(y3),X(fd),Y(0),C3,{dash:'3 7',glow:false,w:2});
    g+=dseg({x:0,y:y3},{x:b,y:y3},C3);
  }
  g+=vArrow(X(-a),Y(0),Y(h),YEL,false);
  g+=T(X(-a),Y(h)-14,'predmet',{c:YEL,size:16});
  if(b!==null&&isFinite(b)){
    g+=vArrow(X(b),Y(0),Y(hi),real?WHITE:'#9fd8ff',!real);
    if(X(b)>20&&X(b)<W-20&&Math.abs(Y(hi)-ay)<H/2+40)g+=T(X(b),hi<0?Y(hi)+26:Y(hi)-12,real?'slika':'navidezna slika',{c:real?WHITE:'#9fd8ff',size:16});
  }
  if(p.handle){g+=`<rect class="handle" x="${n1(X(-a)-36)}" y="${n1(Y(h)-34)}" width="72" height="${n1(h*sy+58)}" rx="12" fill="rgba(255,210,63,.07)" stroke="${YEL}" stroke-dasharray="4 6" style="cursor:ew-resize;touch-action:none"/>`+T(X(-a),Y(0)+48,'⇆ povleci',{c:YEL,size:15});}
  s+=`<g clip-path="url(#${cid})">${g}</g>`;
  return {svg:s,b,hi,real};
}
function lensSketch(kind,f,a,h){
  const W=880,H=330,fd=Math.abs(f);
  let b,hi;if(kind==='conv'){b=a*fd/(a-fd);hi=-h*b/a;}else{b=-a*fd/(a+fd);hi=h*fd/(a+fd);}
  const left=Math.max(a,b<0?-b:0,kind==='conv'?Math.min(2*fd,Math.max(a,fd)*1.1):fd)*1.12;
  const right=Math.max(b>0?b:0,fd*1.5)*1.12;
  const sx=(W-40)/(left+right),sy=(H/2-34)/Math.max(h,Math.abs(hi));
  const r=lensScene({kind,f:fd,a,h,sx,sy,L:20+left*sx,axisY:H/2,W,H});
  return svgWrap(W,H,bg(W,H)+r.svg);
}
function reflectSketch(alpha,mode){
  const W=540,H=300,P={x:270,y:240},R=190,a=rad(alpha);
  const S0={x:P.x-R*Math.sin(a),y:P.y-R*Math.cos(a)},E={x:P.x+R*Math.sin(a),y:P.y-R*Math.cos(a)};
  let s=bg(W,H);
  if(mode==='water'){s+=`<rect x="20" y="${P.y}" width="${W-40}" height="50" fill="rgba(63,160,255,.28)"/><line x1="20" y1="${P.y}" x2="${W-20}" y2="${P.y}" stroke="${CYAN}" stroke-width="3"/>`+T(W-70,P.y+34,'vodna gladina',{c:CYAN,size:15});}
  else{s+=`<rect x="40" y="${P.y}" width="${W-80}" height="9" fill="${SILVER}"/>`;for(let x=50;x<W-40;x+=18)s+=`<line x1="${x}" y1="${P.y+9}" x2="${x-10}" y2="${P.y+22}" stroke="${MUTED}" stroke-width="2"/>`;s+=T(W-80,P.y+44,'zrcalo',{c:SILVER,size:15});}
  s+=`<line x1="${P.x}" y1="${P.y}" x2="${P.x}" y2="24" stroke="${YEL}" stroke-width="2" stroke-dasharray="7 6"/>`+T(P.x+8,20,'vpadna pravokotnica',{c:YEL,size:14,anchor:'start'});
  s+=beam(S0.x,S0.y,P.x,P.y,RED,{arrow:true})+beam(P.x,P.y,E.x,E.y,RED,{arrow:true});
  const aN=-90,aIn=deg(Math.atan2(S0.y-P.y,S0.x-P.x)),aOut=deg(Math.atan2(E.y-P.y,E.x-P.x));
  s+=arc(P.x,P.y,60,aIn,aN,YEL)+arc(P.x,P.y,60,aN,aOut,GREEN);
  const lab=(ang,r,t,c)=>T(P.x+r*Math.cos(rad(ang)),P.y+r*Math.sin(rad(ang))+6,t,{c,size:17});
  s+=lab((aIn+aN)/2,92,`α = ${alpha}°`,YEL)+lab((aN+aOut)/2,92,`β = ${alpha}°`,GREEN);
  if(mode==='mirror'){const aa=aIn<0?aIn+360:aIn;s+=arc(P.x,P.y,120,180,aa,VIO)+lab((180+aa)/2,150,`${90-alpha}°`,VIO);}
  if(mode==='water'){s+=arc(P.x,P.y,125,aOut,0,VIO)+T(P.x+175,P.y-6,`${90-alpha}°`,{c:VIO,size:17});}
  return svgWrap(W,H,s);
}

const TYPES={};
const TYPE_NAMES={mc:'izbirni odgovori',yn:'DA/NE',sort:'povleci in spusti',num:'vnos števila',laser:'laserska uganka',refract:'simulacija loma',focus:'iskanje gorišča',bench:'optična klop',eye:'Optik',camera:'camera obscura',match:'povezovanje'};

function optionBlock(opts,ans,api,o){
  o=o||{};
  const wrap=el('div','opts'+(o.yn?' yn':''));
  const order=o.keep||o.yn?opts.map((_,i)=>i):shuffle(opts.map((_,i)=>i));
  const bs=[];
  order.forEach(i=>{const b=btn(opts[i],'opt',()=>{
    if(api.isResolved()||b.disabled)return;
    const ok=i===ans;b.classList.add(ok?'right':'wrong');if(!ok)b.disabled=true;
    (o.onAnswer||api.submit)(ok,i);
  });bs[i]=b;wrap.appendChild(b);});
  api.onReveal(()=>{bs[ans].classList.add('right');});
  api.onEnd(()=>bs.forEach(b=>b.disabled=true));
  return wrap;
}
function figOf(t){const f=typeof t.fig==='function'?t.fig():t.fig;return f?el('div','fig small',f):null;}

TYPES.mc=(t,area,api)=>{const f=figOf(t);if(f)area.appendChild(f);area.appendChild(optionBlock(t.opts,t.ans,api,{keep:t.keep}));};
TYPES.yn=(t,area,api)=>{const f=figOf(t);if(f)area.appendChild(f);area.appendChild(optionBlock(['DA','NE'],t.ans?0:1,api,{yn:true}));};

TYPES.num=(t,area,api)=>{
  const f=figOf(t);if(f)area.appendChild(f);
  const form=el('div','numform');
  const inputs=t.fields.map(fd=>{
    const row=el('div','numrow');row.appendChild(el('span','nlab',fd.label));
    let inp;
    if(fd.options){inp=el('div','seg');fd.options.forEach((o,i)=>{const b=btn(o,'segb small',()=>{if(api.isResolved())return;inp.querySelectorAll('.segb').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');inp.dataset.v=i;});inp.appendChild(b);});}
    else{inp=el('input','ninp');inp.type='text';inp.inputMode='decimal';inp.autocomplete='off';inp.setAttribute('aria-label',fd.label);
      inp.addEventListener('keydown',e=>{if(e.key==='Enter')chk.click();});}
    row.appendChild(inp);if(fd.unit)row.appendChild(el('span','nunit',fd.unit));
    form.appendChild(row);return {fd,inp,row};
  });
  const chk=btn('Preveri ✓','primary',()=>{
    if(api.isResolved())return;
    let allOk=true,empty=false;
    inputs.forEach(({fd,inp,row})=>{
      let ok=false;
      if(fd.options){if(inp.dataset.v===undefined)empty=true;else ok=+inp.dataset.v===fd.answer;}
      else{const s=inp.value.trim().replace(/\s/g,'').replace(',','.').replace('−','-');if(!s)empty=true;else{let v=parseFloat(s);if(!isNaN(v)){if(fd.abs)v=Math.abs(v);ok=Math.abs(v-fd.answer)<=(fd.tol!=null?fd.tol:0.05);}}}
      row.classList.toggle('right',ok);row.classList.toggle('wrong',!ok);if(!ok)allOk=false;
    });
    if(empty){api.flash('Izpolni vsa polja, nato preveri.');inputs.forEach(({row})=>row.classList.remove('right','wrong'));return;}
    api.submit(allOk);
  });
  form.appendChild(el('div','row')).appendChild(chk);
  area.appendChild(form);
  api.onReveal(()=>inputs.forEach(({fd,inp,row})=>{
    if(fd.options){inp.querySelectorAll('.segb').forEach((b,i)=>b.classList.toggle('sel',i===fd.answer));}
    else inp.value=fmt(fd.answer);
    row.classList.remove('wrong');row.classList.add('right');}));
  api.onEnd(()=>{chk.disabled=true;inputs.forEach(({inp})=>{if(inp.tagName==='INPUT')inp.readOnly=true;});});
  setTimeout(()=>{const first=form.querySelector('input');if(first&&window.innerWidth>800)first.focus();},50);
};

function makeDraggable(node,onDrop,onTap){
  node.addEventListener('pointerdown',e=>{
    if(node.classList.contains('locked'))return;
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();
    const sx=e.clientX,sy=e.clientY;let dragging=false;
    const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!dragging&&Math.hypot(dx,dy)>7){dragging=true;node.classList.add('dragging');}if(dragging)node.style.transform=`translate(${dx}px,${dy}px)`;};
    const up=ev=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
      if(dragging){node.style.transform='';node.classList.remove('dragging');node.style.visibility='hidden';const under=document.elementFromPoint(ev.clientX,ev.clientY);node.style.visibility='';onDrop(under);}
      else onTap();};
    window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  });
}
TYPES.sort=(t,area,api)=>{
  area.appendChild(el('div','sorthint','Povleci kartico v pravo skupino – ali tapni kartico in nato skupino.'));
  const pool=el('div','pool');area.appendChild(pool);
  const bwrap=el('div','buckets');
  const buckets=t.buckets.map((b,bi)=>{const d=el('div','bucket b'+bi);d.dataset.b=bi;d.appendChild(el('div','bhead',b));const list=el('div','blist');d.appendChild(list);bwrap.appendChild(d);return {d,list};});
  area.appendChild(bwrap);
  let selected=null;
  const place=(c,target)=>{(target==='pool'?pool:buckets[target].list).appendChild(c);c.classList.remove('right','wrong','sel');selected=null;api.touched();beep('click');};
  const chips=shuffle(t.items.map((it,i)=>({it,i}))).map(({it})=>{
    const c=el('div','chip',it.html||esc(it.label));c.dataset.b=it.b;pool.appendChild(c);
    makeDraggable(c,under=>{if(!under)return;const bk=under.closest('.bucket');if(bk)place(c,+bk.dataset.b);else if(under.closest('.pool'))place(c,'pool');},
      ()=>{if(api.isResolved())return;if(selected===c){c.classList.remove('sel');selected=null;return;}if(selected)selected.classList.remove('sel');selected=c;c.classList.add('sel');});
    return c;});
  buckets.forEach(({d},bi)=>d.addEventListener('click',e=>{if(selected&&!e.target.closest('.chip'))place(selected,bi);}));
  pool.addEventListener('click',e=>{if(selected&&!e.target.closest('.chip'))place(selected,'pool');});
  const chk=btn('Preveri ✓','primary',()=>{

TYPES.laser=(t,area,api)=>{
  const W=900,H=460;const ms=t.mirrors.map(m=>Object.assign({},m));let solved=false;
  const fig=el('div','fig'),ctr=el('div','laserctrl'),read=el('div','readout');
  area.append(fig,ctr,read);
  ms.forEach((m,i)=>{const box=el('div','mctrl');box.appendChild(btn('⟲','rot',()=>rot(i,15)));box.appendChild(el('span','','Zrcalo '+m.name));box.appendChild(btn('⟳','rot',()=>rot(i,-15)));ctr.appendChild(box);});
  ctr.appendChild(btn('💡 Namig','ghost small',()=>{if(!api.isResolved())api.miss(null,true);}));
  function rot(i,d){if(solved)return;ms[i].a=((ms[i].a+d)%180+180)%180;api.touched();beep('click');draw();}
  function trace(){
    let p={x:t.laser.x,y:t.laser.y},d={x:1,y:0};const pts=[{x:p.x,y:p.y}],hits=[];let hit=false;
    for(let k=0;k<12;k++){
      let best=Infinity,what=null,mi=-1;
      ms.forEach((m,i)=>{const u={x:Math.cos(rad(m.a)),y:-Math.sin(rad(m.a))};const den=cross(d,u);if(Math.abs(den)<1e-9)return;const cp={x:m.x-p.x,y:m.y-p.y};const tt=cross(cp,u)/den,s=cross(cp,d)/den;if(tt>1e-6&&Math.abs(s)<=t.L/2&&tt<best){best=tt;what='m';mi=i;}});
      const Tg=t.target,ox=p.x-Tg.x,oy=p.y-Tg.y,bq=d.x*ox+d.y*oy,cq=ox*ox+oy*oy-Tg.r*Tg.r,disc=bq*bq-cq;
      if(disc>=0){const tt=-bq-Math.sqrt(disc);if(tt>1e-6&&tt<best){best=tt;what='t';}}
      if(what===null){let tb=Infinity;if(d.x>1e-9)tb=Math.min(tb,(W-p.x)/d.x);if(d.x<-1e-9)tb=Math.min(tb,-p.x/d.x);if(d.y>1e-9)tb=Math.min(tb,(H-p.y)/d.y);if(d.y<-1e-9)tb=Math.min(tb,-p.y/d.y);best=tb;what='b';}
      const q={x:p.x+d.x*best,y:p.y+d.y*best};pts.push(q);
      if(what==='t'){hit=true;break;}if(what==='b')break;
      const m=ms[mi],u={x:Math.cos(rad(m.a)),y:-Math.sin(rad(m.a))},n={x:-u.y,y:u.x},dn=d.x*n.x+d.y*n.y;
      const inc=deg(Math.acos(Math.min(1,Math.abs(dn))));
      const nd={x:d.x-2*dn*n.x,y:d.y-2*dn*n.y};
      hits.push({x:q.x,y:q.y,inc,n:dn>0?{x:-n.x,y:-n.y}:n,din:d,dout:nd,name:m.name});
      p=q;d=nd;
    }
    return {pts,hits,hit};
  }
  function draw(){
    const r=trace();let s=bg(W,H);
    for(let x=50;x<W;x+=50)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#0f1630" stroke-width="1"/>`;
    for(let y=50;y<H;y+=50)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#0f1630" stroke-width="1"/>`;
    const Tg=t.target,tc=r.hit?GREEN:RED;
    s+=`<circle cx="${Tg.x}" cy="${Tg.y}" r="${Tg.r+12}" fill="none" stroke="${tc}" stroke-width="2" opacity=".5"/><circle cx="${Tg.x}" cy="${Tg.y}" r="${Tg.r}" fill="${r.hit?'rgba(57,255,136,.35)':'rgba(255,59,92,.12)'}" stroke="${tc}" stroke-width="3" ${r.hit?'filter="url(#glowBig)"':''}/><circle cx="${Tg.x}" cy="${Tg.y}" r="7" fill="${tc}"/>`;
    s+=T(Tg.x+Tg.r+18,Tg.y+7,'TARČA',{c:tc,size:16,anchor:'start'});
    s+=`<rect x="${t.laser.x-58}" y="${t.laser.y-15}" width="58" height="30" rx="6" fill="#2a3355" stroke="${MUTED}" stroke-width="2"/>`+T(t.laser.x-29,t.laser.y+36,'LASER',{c:MUTED,size:14});
    ms.forEach(m=>{const u={x:Math.cos(rad(m.a)),y:-Math.sin(rad(m.a))},h2=t.L/2;
      s+=`<line x1="${n1(m.x-u.x*h2)}" y1="${n1(m.y-u.y*h2)}" x2="${n1(m.x+u.x*h2)}" y2="${n1(m.y+u.y*h2)}" stroke="${SILVER}" stroke-width="8" stroke-linecap="round"/><circle cx="${m.x}" cy="${m.y}" r="4" fill="#5d6a96"/>`;
      s+=T(m.x+(m.lx||0),m.y+(m.ly||-60),m.name,{c:SILVER,size:22});});
    const c=r.hit?GREEN:RED;
    for(let i=0;i<r.pts.length-1;i++){const a=r.pts[i],b=r.pts[i+1];s+=beam(a.x,a.y,b.x,b.y,c,{arrow:true});}
    r.hits.forEach(hh=>{const n=hh.n;
      s+=`<line x1="${n1(hh.x-n.x*65)}" y1="${n1(hh.y-n.y*65)}" x2="${n1(hh.x+n.x*75)}" y2="${n1(hh.y+n.y*75)}" stroke="${YEL}" stroke-width="2" stroke-dasharray="6 6"/>`;
      const aN=deg(Math.atan2(n.y,n.x));let aIn=deg(Math.atan2(-hh.din.y,-hh.din.x)),aOut=deg(Math.atan2(hh.dout.y,hh.dout.x));
      const fix=a=>{while(a-aN>180)a-=360;while(a-aN<-180)a+=360;return a;};aIn=fix(aIn);aOut=fix(aOut);
      if(hh.inc>1){s+=arc(hh.x,hh.y,34,Math.min(aN,aIn),Math.max(aN,aIn),YEL,3)+arc(hh.x,hh.y,40,Math.min(aN,aOut),Math.max(aN,aOut),GREEN,3);}
      s+=T(hh.x+n.x*100,hh.y+n.y*100+6,`${Math.round(hh.inc)}° | ${Math.round(hh.inc)}°`,{c:YEL,size:17});});
    fig.innerHTML=svgWrap(W,H,s);
    read.innerHTML=(r.hits.length?r.hits.map(hh=>`Zrcalo ${hh.name}: <span style="color:${YEL}">vpadni kot ${Math.round(hh.inc)}°</span>, <span style="color:${GREEN}">odbojni kot ${Math.round(hh.inc)}°</span>`).join(' · '):'Žarek ne zadene nobenega zrcala.')+(r.hit?' · <span style="color:#39ff88">🎯 Zadetek!</span>':'');
    if(r.hit&&!solved){solved=true;api.win();}
  }
  api.onReveal(()=>{solved=true;ms.forEach((m,i)=>m.a=t.sol[i]);draw();});
  api.onEnd(()=>ctr.querySelectorAll('button').forEach(b=>b.disabled=true));
  draw();
};

TYPES.refract=(t,area,api)=>{
  const W=900,H=560,x1=330,x2=570,yE=190,i=40,nn=1.5;
  const r=deg(Math.asin(Math.sin(rad(i))/nn));
  const P0={x:130,y:yE-200*Math.tan(rad(i))},P1={x:x1,y:yE},P2={x:x2,y:yE+(x2-x1)*Math.tan(rad(r))};

      s+=arc(P1.x,P1.y,70,0,r,GREEN)+T(P1.x+100,P1.y+26,`≈${Math.round(r)}°`,{c:GREEN,size:18});

      s+=arc(P2.x,P2.y,60,180,180+r,GREEN)+arc(P2.x,P2.y,62,0,i,YEL)+T(P2.x+96,P2.y+30,`${i}°`,{c:YEL,size:18});

TYPES.focus=(t,area,api)=>{

        if(done)s+=dashed(L,y,F,ay,'#ff8aa0');else if(help){const bx=L-110,by=y-(y-ay)*(110/dx);s+=dashed(L,y,bx,by,'#ff8aa0');}}

      const yb=ay+70;s+=`<line x1="${L}" y1="${yb}" x2="${F}" y2="${yb}" stroke="${YEL}" stroke-width="2"/><line x1="${L}" y1="${yb-8}" x2="${L}" y2="${yb+8}" stroke="${YEL}" stroke-width="2"/><line x1="${F}" y1="${yb-8}" x2="${F}" y2="${yb+8}" stroke="${YEL}" stroke-width="2"/>`+T((L+F)/2,yb+26,'f',{c:YEL,size:20});}

TYPES.bench=(t,area,api)=>{

    let props;

  const opts=[['none','👁️ Brez očal'],['conv','Zbiralna leča (+)'],['div','Razpršilna leča (−)']];
  const bmap={};
  opts.forEach(([k,l])=>{const b=btn(l,k==='none'?'ghost':'',()=>{if(done)return;choice=k;Object.values(bmap).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');api.touched();draw();
    if(k==='none')return;const ok=my?k==='div':k==='conv';if(ok){done=true;draw();api.win();}else api.miss();});bmap[k]=b;btns.appendChild(b);});
  api.onReveal(()=>{choice=my?'div':'conv';done=true;draw();});
  api.onEnd(()=>Object.values(bmap).forEach(b=>b.disabled=true));
  draw();
};

/* --- camera obscura --- */
TYPES.camera=(t,area,api)=>{
  const W=900,H=440,ox=110,oh=160,hx=380,ay=250,D=hx-ox;let d=120;
  const fig=el('div','fig'),row=el('div','rangerow'),info=el('div','benchinfo');
  const rng=el('input');rng.type='range';rng.min=60;rng.max=480;rng.step=10;rng.value=d;rng.setAttribute('aria-label','Razdalja zaslona od luknjice');
  row.append(el('span','','Zaslon: bližje'),rng,el('span','','dlje'));
  area.append(fig,row,info);
  function candle(x,yb,hgt,dir,w){const body=hgt*0.72,y1=yb-dir*body;
    return `<rect x="${n1(x-w/2)}" y="${n1(Math.min(yb,y1))}" width="${n1(w)}" height="${n1(body)}" fill="#f4efe1" rx="3"/><ellipse cx="${n1(x)}" cy="${n1(yb-dir*hgt*0.88)}" rx="${n1(w*0.42)}" ry="${n1(hgt*0.12)}" fill="${ORANGE}" filter="url(#glow)"/>`;}
  function draw(){
    const k=d/D,sxp=hx+d;let s=bg(W,H);
    s+=`<rect x="${hx}" y="80" width="${W-hx-10}" height="340" fill="#0a0f1f" stroke="${MUTED}" stroke-width="2"/>`;
    s+=`<line x1="${hx}" y1="80" x2="${hx}" y2="${ay-7}" stroke="${SILVER}" stroke-width="7"/><line x1="${hx}" y1="${ay+7}" x2="${hx}" y2="420" stroke="${SILVER}" stroke-width="7"/>`+T(hx-10,ay-24,'luknjica',{c:SILVER,size:15,anchor:'end'});
    s+=`<line x1="${sxp}" y1="95" x2="${sxp}" y2="405" stroke="#cfd8f0" stroke-width="6" opacity=".55"/>`+T(sxp,72,'zaslon',{c:'#cfd8f0',size:15});
    s+=candle(ox,ay+80,oh,1,26)+T(ox,ay+112,'sveča',{c:YEL,size:15});
    s+=beam(ox,ay-80,sxp,ay+80*k,RED)+beam(ox,ay+80,sxp,ay-80*k,GREEN);
    s+=candle(sxp-6,ay-80*k,oh*k,-1,Math.max(6,26*k));
    fig.innerHTML=svgWrap(W,H,s);
    info.innerHTML=`<span class="pill">razdalja zaslona: ${fmt(d/20)} cm</span><span class="pill">višina slike: ${fmt(oh*k/20)} cm</span><span class="pill prop">slika je obrnjena</span>`;
  }
  rng.addEventListener('input',()=>{d=+rng.value;api.touched();draw();});
  area.appendChild(askBlock(t.ask,api));
  draw();
};

   expl:'Krajša goriščna razdalja pomeni, da leča žarke bolj lomi. Moč leče opišemo z lomnostjo v dioptrijah: j = 1/f (f v metrih) → leča A: 1/0,05 m = 20 D, leča B: 1/0,2 m = 5 D.'}
 ],
 learn:['Zbiralna leča je na sredini debelejša in vzporedne žarke zbere v gorišču F.','Razpršilna leča je na robu debelejša; vzporedne žarke razprši, kot da bi prihajali iz navideznega gorišča.','Goriščna razdalja f je razdalja od središča leče do gorišča – krajša kot je, močnejša je leča.']},

{id:'s5',icon:'📐',title:'Preslikave z zbiralno lečo',part:'Optična klop',
 fact:'Slika v fotoaparatu in v tvojem očesu je <b>obrnjena na glavo</b>! Možgani so se že v otroštvu naučili sliko »obrniti«, zato svet vidimo pokončno.',
 tasks:[
  {type:'bench',kind:'conv',f:4,h:3,a0:14,topic:'Lastnosti slike pri zbiralni leči',
   q:'Optična klop (f = 4 cm): povleci predmet (rumeno puščico) ali uporabi drsnik. Igra sproti riše tri značilne žarke in sliko. Izpolni vse tri naloge.',
   goals:[{text:'Postavi predmet tako, da bo slika <b>realna in povečana</b>.',test:a=>a>4&&a<8,ok:'Realna in povečana! Predmet je med F in 2F.',hint:'Realna povečana slika nastane, ko je predmet med goriščem F in točko 2F.'},
          {text:'Postavi predmet tako, da bo slika <b>realna in pomanjšana</b>.',test:a=>a>8,ok:'Realna in pomanjšana! Predmet je dlje od 2F.',hint:'Predmet mora biti dlje od 2F (več kot dve goriščni razdalji).'},
          {text:'Postavi predmet tako, da bo slika <b>navidezna in povečana</b> (kot pri lupi).',test:a=>a<4,ok:'Navidezna, pokončna in povečana – tako deluje lupa!',hint:'Predmet postavi bližje leči, kot je gorišče F.'}],
   hint:'Opazuj, kje je predmet glede na F in 2F.',
   expl:'Predmet dlje od 2F → slika realna, obrnjena, pomanjšana. Predmet med F in 2F → realna, obrnjena, povečana. Predmet bližje od F → slika je navidezna, pokončna in povečana (lupa). Rdeči žarek gre vzporedno z osjo in nato skozi gorišče, zeleni naravnost skozi središče, vijolični skozi gorišče in nato vzporedno z osjo.'},
  {type:'num',id:'c1',topic:'Računanje z enačbo leče',q:'Zbiralna leča ima goriščno razdaljo f = 4 cm. Predmet, visok h = 3 cm, je od leče oddaljen a = 12 cm. Izračunaj oddaljenost slike b in velikost slike h′. Kakšna je slika?',
   fields:[{label:'oddaljenost slike b =',answer:6,unit:'cm',tol:0.1},{label:'slika je',options:['realna','navidezna'],answer:0},{label:'velikost slike h′ =',answer:1.5,unit:'cm',tol:0.05}],
   hint:'Uporabi enačbo leče 1/f = 1/a + 1/b → 1/b = 1/4 − 1/12. Nato h′ = h · b / a.',
   expl:'1/b = 1/(4 cm) − 1/(12 cm) = 2/(12 cm) → b = 6 cm. Ker je b pozitiven, je slika realna (in obrnjena). h′ = h · b/a = 3 cm · 6/12 = 1,5 cm.',sketch:()=>lensSketch('conv',4,12,3)},
  {type:'num',id:'c2',topic:'Računanje z enačbo leče',q:'Zbiralna leča ima f = 6 cm. Predmet, visok h = 2 cm, je od leče oddaljen a = 3 cm. Izračunaj oddaljenost slike |b| in velikost slike h′. Kakšna je slika?',
   fields:[{label:'oddaljenost slike |b| =',answer:6,unit:'cm',tol:0.1,abs:true},{label:'slika je',options:['realna','navidezna'],answer:1},{label:'velikost slike h′ =',answer:4,unit:'cm',tol:0.05}],
   hint:'1/b = 1/6 − 1/3. Če dobiš negativen b, je slika navidezna – za razdaljo zapiši |b|.',
   expl:'1/b = 1/6 − 1/3 = −1/6 → b = −6 cm. Negativen b pomeni navidezno sliko na isti strani leče kot predmet, 6 cm od leče. h′ = h · |b|/a = 2 cm · 6/3 = 4 cm (pokončna, povečana).',sketch:()=>lensSketch('conv',6,3,2)},
  {type:'num',id:'c3',topic:'Računanje z enačbo leče',q:'Zbiralna leča ima f = 3 cm. Predmet, visok h = 6 mm, je od leče oddaljen a = 4 cm. Izračunaj b in h′. Kakšna je slika?',
   fields:[{label:'oddaljenost slike b =',answer:12,unit:'cm',tol:0.1},{label:'slika je',options:['realna','navidezna'],answer:0},{label:'velikost slike h′ =',answer:18,unit:'mm',tol:0.1}],
   hint:'Pazi na enote: razdalji sta v cm, višina predmeta v mm. Povečava b/a nima enote.',
   expl:'1/b = 1/3 − 1/4 = 1/12 → b = 12 cm, slika je realna. Povečava b/a = 12/4 = 3, zato je h′ = 3 · 6 mm = 18 mm.',sketch:()=>lensSketch('conv',3,4,0.6)},
  {type:'num',id:'c4',topic:'Računanje z enačbo leče',q:'Z lupo (f = 10 cm) opazuješ mravljo, dolgo 3 mm, ki je 8 cm od lupe. Kako daleč od lupe nastane slika in kako velika je? Kakšna je slika?',
   fields:[{label:'oddaljenost slike |b| =',answer:40,unit:'cm',tol:0.2,abs:true},{label:'slika je',options:['realna, obrnjena','navidezna, pokončna'],answer:1},{label:'velikost slike h′ =',answer:15,unit:'mm',tol:0.1}],
   hint:'1/b = 1/10 − 1/8. Mravlja je bližje od gorišča – kakšen predznak bo imel b?',
   expl:'1/b = 1/10 − 1/8 = −1/40 → b = −40 cm. Slika je navidezna in pokončna, 40 cm od leče (na isti strani kot mravlja). h′ = 3 mm · 40/8 = 15 mm.',sketch:()=>lensSketch('conv',10,8,0.3)},
  {type:'num',id:'c5',topic:'Računanje z enačbo leče',q:'Projektor ima objektiv z goriščno razdaljo f = 10 cm. Platno je 110 cm od leče, diapozitiv je visok 2 cm. Kako daleč od leče mora biti diapozitiv in kako velika je slika na platnu?',
   fields:[{label:'oddaljenost diapozitiva a =',answer:11,unit:'cm',tol:0.1},{label:'velikost slike h′ =',answer:20,unit:'cm',tol:0.1}],
   hint:'Tokrat poznaš b = 110 cm. Iz 1/a = 1/f − 1/b izračunaj a, nato h′ = h · b/a.',
   expl:'1/a = 1/10 − 1/110 = 10/110 → a = 11 cm. Povečava b/a = 110/11 = 10, zato je slika na platnu visoka h′ = 10 · 2 cm = 20 cm (realna, obrnjena, povečana).',sketch:()=>lensSketch('conv',10,11,2)}
 ],
 learn:['Trije značilni žarki: vzporedni gre po leči skozi gorišče, središčni gre naravnost, goriščni gre po leči vzporedno z osjo.','Predmet dlje od F → realna, obrnjena slika; predmet bližje od F → navidezna, pokončna, povečana slika.','Enačba leče 1/f = 1/a + 1/b in povečava h′/h = b/a; negativen b pomeni navidezno sliko.']},

{id:'s6',icon:'🔭',title:'Razpršilna leča',part:'Razpršilnik',
 fact:'Kukalo (»špijonka«) na vhodnih vratih ima razpršilno lečo. Zato skozi njo vidiš skoraj ves hodnik – pomanjšan, a v zelo širokem kotu.',
 tasks:[
  {type:'bench',kind:'div',f:4,h:3,a0:10,topic:'Slika pri razpršilni leči',q:'Premikaj predmet pred razpršilno lečo (f = −4 cm) in opazuj sliko – postavi ga zelo blizu in zelo daleč.',
   ask:{q:'Kakšna je slika pri razpršilni leči?',opts:['realna, obrnjena, povečana','navidezna, pokončna, pomanjšana – vedno, ne glede na lego predmeta','navidezna, pokončna, povečana','odvisno od lege predmeta: včasih realna, včasih navidezna'],ans:1},
   hint:'Ali se lastnosti slike (oznake pod sliko) spremenijo, ko predmet premikaš?',
   expl:'Razpršilna leča žarke vedno razprši, zato se sekajo le njihovi podaljški. Slika je vedno navidezna, pokončna in pomanjšana ter leži med lečo in goriščem.'},
  {type:'yn',topic:'Slika pri razpršilni leči',q:'Ali lahko z razpršilno lečo dobimo sliko na zaslonu?',ans:false,
   hint:'Na zaslonu lahko ujamemo le sliko, kjer se sekajo pravi žarki.',expl:'Ne. Na zaslonu ujamemo samo realno sliko, kjer se sekajo pravi žarki. Razpršilna leča daje le navidezne slike.'},
  {type:'mc',topic:'Gorišče razpršilne leče',q:'Kam gredo vzporedni žarki po prehodu skozi razpršilno lečo?',
   opts:['zberejo se v gorišču za lečo','razpršijo se, kot da bi izhajali iz gorišča pred lečo','gredo naprej vzporedno','odbijejo se nazaj'],ans:1,
   hint:'Spomni se naloge z iskanjem navideznega gorišča.',expl:'Vzporedni žarki se po razpršilni leči razpršijo. Njihovi podaljški nazaj se sekajo v navideznem gorišču pred lečo.'},
  {type:'sort',topic:'Uporaba leč',q:'Razvrsti, kje uporabljamo zbiralno in kje razpršilno lečo.',buckets:['Zbiralna leča','Razpršilna leča'],
   items:[{label:'lupa',b:0},{label:'objektiv projektorja',b:0},{label:'očala za daljnovidne',b:0},{label:'očesna leča',b:0},{label:'objektiv fotoaparata',b:0},{label:'kukalo na vratih',b:1},{label:'očala za kratkovidne',b:1},{label:'okular gledališkega daljnogleda',b:1}],
   hint:'Kjer potrebujemo realno sliko (na platnu, senzorju, mrežnici) ali povečavo kot pri lupi, je zbiralna leča.',
   expl:'Zbiralne leče: lupa, projektor, fotoaparat, očesna leča in očala za daljnovidne. Razpršilne leče: kukalo, očala za kratkovidne in okular gledališkega (Galilejevega) daljnogleda.'},
  {type:'mc',topic:'Slika pri razpršilni leči',q:'Kako najhitreje ugotoviš, da je leča razpršilna?',
   opts:['Pogledaš skozi njo besedilo: črke so manjše in pokončne.','Z njo na soncu zažgeš papir.','Z njo na steni dobiš sliko okna.','Črke so skozi lečo povečane.'],ans:0,
   hint:'Kakšna je slika pri razpršilni leči?',expl:'Razpršilna leča vedno da navidezno, pokončno in pomanjšano sliko – črke so skozi njo manjše. Zažiganje papirja in slika okna na steni sta znaka zbiralne leče.'}
 ],
 learn:['Razpršilna leča je na robu debelejša in vzporedne žarke razprši.','Njena slika je vedno navidezna, pokončna in pomanjšana – ne moremo je ujeti na zaslon.','Uporabljamo jo v očalih za kratkovidne in v kukalu na vratih.']},

{id:'s7',icon:'👁️',title:'Oko in camera obscura',part:'Umetno oko',
 fact:'V mrežnici enega samega očesa je okoli <b>120 milijonov paličic</b> (zaznavajo svetlobo v mraku) in okoli <b>6 milijonov čepkov</b> (zaznavajo barve).',
 tasks:[
  {type:'eye',cond:'myopia',topic:'Kratkovidnost',q:'Optik, na delo! To oko je <b>kratkovidno</b>. Izberi lečo za očala, da se žarki od daljnih predmetov zberejo na mrežnici.',
   hint:'Žarki se zberejo prezgodaj (pred mrežnico). Očala jih morajo najprej nekoliko razpršiti.',
   expl:'Pri kratkovidnem očesu je očesna leča premočna ali zrklo predolgo, zato slika daljnih predmetov nastane pred mrežnico. Razpršilna leča (negativna dioptrija) žarke razprši in slika se premakne na mrežnico.'},
  {type:'eye',cond:'hyperopia',topic:'Daljnovidnost',q:'Novo oko je <b>daljnovidno</b>. Izberi pravo lečo za očala.',
   hint:'Žarki se zberejo prepozno (za mrežnico). Očala jim morajo pomagati, da se zberejo prej.',
   expl:'Pri daljnovidnem očesu je očesna leča prešibka ali zrklo prekratko, zato bi slika nastala za mrežnico. Zbiralna leča (pozitivna dioptrija) žarke dodatno zbere in slika se premakne na mrežnico.'},
  {type:'camera',topic:'Camera obscura',q:'Camera obscura (temna komora): svetloba sveče gre skozi majhno luknjico na zaslon. Z drsnikom premikaj zaslon in opazuj sliko.',
   ask:{q:'Kaj se zgodi s sliko, ko zaslon odmikaš od luknjice?',opts:['Slika se poveča, ostane pa obrnjena.','Slika se zmanjša.','Slika postane pokončna.','Slika izgine.'],ans:0},
   hint:'Sledi rdečemu in zelenemu žarku skozi luknjico – ali se za luknjico razmikata ali približujeta?',
   expl:'Svetloba se širi premočrtno, zato se žarka z vrha in dna sveče v luknjici prekrižata – slika je obrnjena. Dlje kot je zaslon, bolj se žarka razmakneta, zato je slika večja (a tudi temnejša). Podobno nastane slika v očesu.'},
  {type:'mc',topic:'Dioptrija',q:'Na receptu za očala piše <b>+2 D</b> (dioptriji). Kakšna leča je to?',
   opts:['razpršilna leča z goriščno razdaljo 2 m','zbiralna leča z goriščno razdaljo 50 cm','zbiralna leča z goriščno razdaljo 2 cm','razpršilna leča z goriščno razdaljo 50 cm'],ans:1,
   hint:'Lomnost j = 1/f, kjer je f v metrih. Pozitiven predznak pomeni zbiralno lečo.',
   expl:'f = 1/j = 1/(2 D) = 0,5 m = 50 cm. Plus pomeni zbiralno lečo – takšna očala nosijo daljnovidni.'},
  {type:'mc',topic:'Barvna slepota',q:'Kaj pomeni barvna slepota?',
   opts:['Človek ne vidi ničesar.','Človek vidi samo v temi.','Človek nekaterih barv (najpogosteje rdeče in zelene) ne razlikuje dobro.','Človek vidi vse predmete obrnjeno.'],ans:2,
   hint:'Barve zaznavamo s čepki v mrežnici.',
   expl:'Barve zaznavamo s čepki v mrežnici. Če ena vrsta čepkov ne deluje pravilno, človek težko loči nekatere barve – najpogosteje rdečo in zeleno. Pogostejša je pri fantih kot pri dekletih.'},
  {type:'mc',topic:'Optične prevare',q:'Optična prevara: katera vodoravna bela črta je daljša?',fig:illusionFig,opts:['zgornja','spodnja','obe sta enako dolgi'],ans:2,keep:true,
   hint:'Pokrij puščice na koncih s prsti ali izmeri z ravnilom na zaslonu.',
   expl:'Črti sta enako dolgi. Puščice na koncih zavedejo možgane. Optične prevare pokažejo, da vid ni le delo očesa, ampak tudi možganov, ki sliko razlagajo.'}
 ],
 learn:['V očesu zbiralna leča ustvari na mrežnici realno, obrnjeno, pomanjšano sliko – podobno kot v cameri obscuri.','Kratkovidnost: slika pred mrežnico → razpršilna leča. Daljnovidnost: slika za mrežnico → zbiralna leča.','Lomnost leče merimo v dioptrijah: j = 1/f (f v metrih).']},

{id:'s8',icon:'📷',title:'Optične naprave',part:'Opazovalnica',
 fact:'Galileo Galilei je leta <b>1610</b> s preprostim teleskopom, ki ga je izdelal sam, odkril štiri največje Jupitrove lune.',
 tasks:[
  {type:'mc',topic:'Lupa',q:'Kam moramo postaviti predmet, da leča deluje kot lupa?',opts:['bližje leči, kot je gorišče','točno v gorišče','med F in 2F','dlje od 2F'],ans:0,keep:true,
   hint:'Lupa da navidezno, pokončno, povečano sliko. Kje mora biti predmet za takšno sliko?',
   expl:'Če je predmet bližje leči od gorišča, je slika navidezna, pokončna in povečana – to je lupa.'},
  {type:'mc',topic:'Projektor',q:'Zakaj diapozitiv v klasičnem projektorju vstavimo obrnjen (na glavo)?',
   opts:['Ker je slika zbiralne leče na platnu obrnjena – tako je na platnu spet pokončna.','Ker se tako manj segreje.','Ker ima projektor razpršilno lečo.','Zaradi odboja svetlobe na platnu.'],ans:0,
   hint:'Kakšna je realna slika zbiralne leče?',
   expl:'Diapozitiv je med F in 2F, zato je slika na platnu realna, povečana in obrnjena. Če diapozitiv vstavimo obrnjen, je slika na platnu pokončna.'},
  {type:'mc',topic:'Teleskop in daljnogled',q:'Astronomski teleskop ima dve zbiralni leči: objektiv in okular. Kakšno vlogo ima okular?',
   opts:['Okular deluje kot lupa – poveča sliko, ki jo ustvari objektiv.','Okular sliko pomanjša, da vidimo več zvezd.','Okular svetlobo odbije nazaj proti nebu.','Okular je le zaščitno steklo.'],ans:0,
   hint:'Skozi okular gledamo z očesom – podobno kot skozi …',
   expl:'Objektiv ustvari realno sliko oddaljenega telesa, okular pa to sliko poveča kot lupa. Podobno je zgrajen daljnogled, ki ima pogosto še prizme, da je slika pokončna.'},
  {type:'yn',topic:'Teleskop in daljnogled',q:'Ali drži: Daljnogled poveča zorni kot, pod katerim vidimo oddaljen predmet, zato se nam predmet zdi bližji.',ans:true,
   hint:'Večji kot je predmet videti, bližji se nam zdi.',expl:'Drži. Daljnogled in teleskop ustvarita sliko, ki jo vidimo pod večjim zornim kotom – predmet je videti večji in zato bližji.'},
  {type:'match',topic:'Optične naprave',q:'Poveži vsako napravo z vrsto leče in s sliko, ki jo ustvari.',
   cols:[{label:'Vrsta leče',options:['zbiralna','razpršilna']},{label:'Slika',options:['realna, obrnjena, povečana','realna, obrnjena, pomanjšana','navidezna, pokončna, povečana','navidezna, pokončna, pomanjšana']}],
   rows:[{name:'🔍 Lupa',ans:[0,2]},{name:'📽️ Projektor',ans:[0,0]},{name:'📷 Fotoaparat',ans:[0,1]},{name:'🚪 Kukalo na vratih',ans:[1,3]}],
   hint:'Pomisli: ali slika nastane na platnu ali senzorju (realna) ali jo vidimo le skozi lečo (navidezna)? Je večja ali manjša od predmeta?',
   expl:'Lupa: predmet bližje od F → navidezna, pokončna, povečana. Projektor: predmet med F in 2F → realna, obrnjena, povečana slika na platnu. Fotoaparat: oddaljen predmet → realna, obrnjena, pomanjšana slika na senzorju. Kukalo ima razpršilno lečo → navidezna, pokončna, pomanjšana.'}
 ],
 learn:['Lupa da navidezno, pokončno in povečano sliko – predmet je bližje od gorišča.','Projektor in fotoaparat ustvarita realno, obrnjeno sliko na platnu oziroma senzorju.','Daljnogled in teleskop imata objektiv in okular, ki deluje kot lupa.']},

{id:'final',final:true,icon:'⚡',title:'Prižgi stroj!',part:'Glavno stikalo',
 fact:'Svetloba je najhitrejša stvar v vesolju: v eni sekundi bi Zemljo obkrožila kar <b>7,5-krat</b>. Zdaj pa pokaži, kako hitro misliš ti!',

  {level:2,time:45,type:'mc',topic:'Oko',q:'Kakšna je slika na mrežnici zdravega očesa?',opts:['realna, obrnjena, pomanjšana','navidezna, pokončna, povečana','realna, pokončna, povečana','navidezna, obrnjena, pomanjšana'],ans:0,
   hint:'Oko deluje podobno kot fotoaparat ali camera obscura.',expl:'Očesna leča je zbiralna in na mrežnici ustvari realno, obrnjeno in pomanjšano sliko. Možgani jo »obrnejo«.'},
  {level:2,time:45,type:'mc',topic:'Kratkovidnost',q:'Sošolec brez očal ostro vidi besedilo v zvezku, table iz zadnje klopi pa ne. Kaj velja zanj?',
   opts:['Je kratkoviden in potrebuje razpršilno lečo.','Je daljnoviden in potrebuje zbiralno lečo.','Je kratkoviden in potrebuje zbiralno lečo.','Očal ne potrebuje.'],ans:0,
   hint:'Kratkovidni dobro vidijo na kratko (blizu).',expl:'Kdor dobro vidi blizu, slabo pa daleč, je kratkoviden. Slika daljnih predmetov nastane pred mrežnico, zato potrebuje razpršilno lečo.'},
  {level:3,time:90,type:'num',id:'f7',topic:'Računanje z enačbo leče',q:'Predmet, visok 4 cm, je 15 cm od zbiralne leče z goriščno razdaljo 5 cm. Izračunaj oddaljenost slike b in velikost slike h′.',
   fields:[{label:'oddaljenost slike b =',answer:7.5,unit:'cm',tol:0.1},{label:'velikost slike h′ =',answer:2,unit:'cm',tol:0.05}],
   hint:'1/b = 1/5 − 1/15, nato h′ = h · b/a.',expl:'1/b = 1/5 − 1/15 = 2/15 → b = 7,5 cm. h′ = 4 cm · 7,5/15 = 2 cm. Slika je realna, obrnjena in pomanjšana (predmet je dlje od 2F).',sketch:()=>lensSketch('conv',5,15,4)},
  {level:3,time:90,type:'num',id:'f8',topic:'Odbojni zakon',q:'Vpadni in odbiti žarek oklepata kot 70°. Kolikšen je vpadni kot?',fields:[{label:'vpadni kot α =',answer:35,unit:'°',tol:0.5}],
   hint:'Kot med žarkoma je vsota vpadnega in odbojnega kota, ta dva pa sta enaka.',expl:'Vpadni in odbojni kot sta enaka, skupaj pa merita 70°. Torej α = 70° : 2 = 35°.',sketch:()=>reflectSketch(35)},
  {level:3,time:90,type:'mc',topic:'Lastnosti slike pri zbiralni leči',q:'Predmet je 20 cm od zbiralne leče z goriščno razdaljo 10 cm. Kakšna je slika?',
   opts:['realna, obrnjena, enako velika, 20 cm za lečo','navidezna, pokončna, povečana','realna, obrnjena, pomanjšana, 10 cm za lečo','slika ne nastane'],ans:0,
   hint:'Predmet je točno v 2F.',expl:'a = 20 cm = 2f. Iz 1/b = 1/10 − 1/20 = 1/20 sledi b = 20 cm. Povečava b/a = 1, zato je slika realna, obrnjena in enako velika.',sketch:()=>lensSketch('conv',10,20,2)},
  {level:3,time:90,type:'num',id:'f10',topic:'Camera obscura',q:'V cameri obscuri je zaslon 10 cm za luknjico. Drevo, visoko 6 m, je 30 m pred luknjico. Kako visoka je slika drevesa na zaslonu?',
   fields:[{label:'višina slike =',answer:2,unit:'cm',tol:0.05}],
   hint:'Slika je tolikokrat manjša od drevesa, kolikokrat je zaslon bližje luknjici kot drevo. Pretvori enote v cm!',
   expl:'Razmerje razdalj je 10 cm : 3000 cm = 1 : 300. Slika je 300-krat manjša od drevesa: 600 cm : 300 = 2 cm (in obrnjena).'}
 ],
 learn:['Pri odboju sta vpadni in odbojni kot enaka, merjena od vpadne pravokotnice.','Lom: v gostejšo snov k pravokotnici, v redkejšo stran od nje.','Zbiralna leča: realna slika (predmet dlje od F) ali navidezna (bližje od F); razpršilna leča: vedno navidezna, pokončna, pomanjšana.']}
];

/* ================= stanje igre ================= */
function stageMax(st){return st.tasks.length*(st.final?20:10);}
function totalPoints(){return STAGES.reduce((s,st)=>s+((S.progress[st.id]&&S.progress[st.id].points)||0),0);}
function maxPoints(){return STAGES.reduce((s,st)=>s+stageMax(st),0);}
function addWrong(sid,topic){S.wrong[sid]=S.wrong[sid]||[];if(!S.wrong[sid].includes(topic))S.wrong[sid].push(topic);}
let TIMER=null;function clearTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;}}
function screen(){clearTimer();const app=$('#app');app.innerHTML='';window.scrollTo(0,0);return app;}

function updateScorebar(){
  const sb=$('#scorebar');sb.innerHTML='';if(!S.mode)return;
  if(S.mode==='solo'){const done=STAGES.filter(s=>S.progress[s.id]&&S.progress[s.id].done).length;sb.innerHTML=`<span class="pill">⭐ ${totalPoints()} točk</span><span class="pill">💡 ${done}/${STAGES.length} delov stroja</span>`;}
  else S.teams.forEach((tm,i)=>{const d=el('div','team');d.style.setProperty('--tc',TEAM_COLORS[i]);d.innerHTML=`<span class="tn">${esc(tm.name)}</span><b class="ts">${tm.score}</b>`;
    d.appendChild(btn('−','tiny',()=>{tm.score=Math.max(0,tm.score-5);save();updateScorebar();}));d.appendChild(btn('+','tiny',()=>{tm.score+=5;save();updateScorebar();}));sb.appendChild(d);});
}
function applyFont(){document.documentElement.style.fontSize=(20*S.fs)+'px';}
function updateSoundBtn(){const b=$('#bSound');b.textContent=S.sound?'🔊 Zvok vklopljen':'🔇 Zvok izklopljen';b.classList.toggle('on',S.sound);}

/* ================= zasloni ================= */
function renderHome(){
  const app=screen();
  const hasProgress=S.mode&&Object.keys(S.progress).length>0;
  const c=el('section','hero');
  c.innerHTML=`<h1>Lovci na svetlobo</h1>
  <p class="story">V temnem laboratoriju je ugasnil <b>svetlobni stroj</b>. Kot raziskovalke in raziskovalci ga morate popraviti: vsaka rešena stopnja prižge en del stroja. Le z znanjem o svetlobi – odboju, lomu, lečah in očesu – bo stroj spet zasvetil!</p>
  <div class="machine card">${machineSVG()}</div>`;
  const modes=el('div','modes');
  const m1=btn('<b>👥 Razredni način</b><span>Projekcija, 2–4 ekipe. Učitelj vodi igro in dodeljuje točke ekipam.</span>','mode laser',()=>startMode('class'));
  const m2=btn('<b>🧑‍🔬 Samostojni način</b><span>Učenec igra sam, zbira točke in prižiga stroj.</span>','mode primary',()=>startMode('solo'));
  modes.append(m1,m2);c.appendChild(modes);
  if(hasProgress){const r=el('div','row center');r.appendChild(btn(`▶ Nadaljuj (${S.mode==='class'?'razredni':'samostojni'} način)`,'violet',renderMap));c.appendChild(r);}
  c.appendChild(el('p','muted','Za projekcijo: povečaj pisavo z gumbom A+ in vklopi celozaslonski način ⛶. Zvok je privzeto izklopljen.'));
  app.appendChild(c);updateScorebar();
}
function startMode(mode){
  const has=Object.keys(S.progress).length>0;
  if(has&&!confirm('Začnem novo igro? Dosedanji napredek in točke bodo izbrisani.'))return;
  S.mode=mode;S.progress={};S.wrong={};S.teams=[];save();
  if(mode==='class')renderTeams();else{updateScorebar();renderMap();}
}
function renderTeams(){
  const app=screen();let n=Math.max(2,S.teams.length||2);
  const names=DEFAULT_TEAMS.slice();S.teams.forEach((t,i)=>names[i]=t.name);
  const c=el('section','card');c.innerHTML='<h2>👥 Ekipe</h2><p>Koliko ekip igra?</p>';
  const cnt=el('div','row cnt');const list=el('div','teamsetup');
  function draw(){cnt.innerHTML='';[2,3,4].forEach(k=>{const b=btn(k+' ekipe','',()=>{n=k;draw();});if(k===n)b.classList.add('sel');cnt.appendChild(b);});
    list.innerHTML='';for(let i=0;i<n;i++){const inp=el('input');inp.value=names[i];inp.style.setProperty('--tc',TEAM_COLORS[i]);inp.setAttribute('aria-label','Ime ekipe '+(i+1));inp.addEventListener('input',()=>names[i]=inp.value);list.appendChild(inp);}}
  draw();c.append(cnt,el('p','','Imena ekip (lahko jih spremeniš):'),list);
  const r=el('div','row end');r.style.marginTop='1rem';
  r.appendChild(btn('Začni igro ▶','primary',()=>{S.teams=names.slice(0,n).map(x=>({name:(x||'Ekipa').trim()||'Ekipa',score:0}));save();updateScorebar();renderMap();}));
  c.appendChild(r);app.appendChild(c);
}
function renderMap(){
  if(!S.mode)return renderHome();
  const app=screen();updateScorebar();
  const c=el('section','card');
  c.innerHTML=`<h2>🔧 Svetlobni stroj</h2><div class="machine">${machineSVG()}</div><p class="muted">Izberi stopnjo. Stopnje lahko igrate po vrsti ali posamezno – po učnih urah.</p>`;
  const grid=el('div','stages');
  STAGES.forEach((st,i)=>{const pr=S.progress[st.id];const lit=pr&&pr.done;
    const b=btn(`<span class="num">${st.final?'FINALE':(i+1)+'. stopnja'} · ${st.part}</span><span class="ttl">${st.icon} ${st.title}</span><span class="st">${lit?`✅ prižgano · ${pr.points}/${stageMax(st)} točk`:(pr&&Object.keys(pr.tasks||{}).length?`⏳ v teku · ${pr.points} točk`:`○ ${st.tasks.length} nalog`)}</span>`,'scard'+(lit?' lit':'')+(st.final?' final':''),()=>renderIntro(i));
    grid.appendChild(b);});
  c.appendChild(grid);
  const r=el('div','row end');r.style.marginTop='1rem';
  r.appendChild(btn('🔄 Ponastavi napredek','ghost small',()=>{if(!confirm('Res izbrišem napredek in točke?'))return;S.progress={};S.wrong={};S.teams.forEach(t=>t.score=0);save();renderMap();}));
  r.appendChild(btn('🏁 Rezultati in ponovitev','violet',renderEnd));
  c.appendChild(r);app.appendChild(c);
}
function renderIntro(si){
  const app=screen();const st=STAGES[si];
  const types=[...new Set(st.tasks.map(t=>TYPE_NAMES[t.type]))].join(', ');
  const c=el('section','card pop');
  c.innerHTML=`<h2>${st.icon} ${st.final?'Finalni izziv':(si+1)+'. stopnja'}: ${st.title}</h2><p class="muted">Del stroja: <b>${st.part}</b></p>
   <div class="fact">✨ <b>Zanimivost:</b> ${st.fact}</div>
   <p>Čaka te <b>${st.tasks.length} nalog</b>: ${types}.</p>`+
   (st.final?`<p>Pravila: tri težavnostne ravni (<b style="color:#39ff88">1. nivo osnova</b>, <b style="color:#ffd23f">2. nivo zahtevnejše</b>, <b style="color:#ff3b5c">3. nivo besedilne naloge</b>), <b>omejen čas</b> in <b>dvojne točke</b>. Vsako nalogo rešuješ le enkrat.</p>`:
   `<p class="muted">Če se zmotiš, dobiš namig in še en poskus. Pravilno v prvem poskusu: 10 točk, v drugem: 5 točk.</p>`);
  const r=el('div','row end');r.appendChild(btn('⟵ Na stroj','ghost',renderMap));r.appendChild(btn('Začni ▶','primary',()=>beginStage(si)));
  c.appendChild(r);app.appendChild(c);
}
function beginStage(si){const st=STAGES[si];const prev=S.progress[st.id];S.progress[st.id]={done:!!(prev&&prev.done),points:0,tasks:{}};S.wrong[st.id]=[];save();updateScorebar();renderTask(si,0);}

const PRAISE=['Odlično!','Bravo!','Pravilno!','Točno tako!','Žarek zadet!','Super!'];
function renderTask(si,ti){
  const app=screen();const st=STAGES[si],t=st.tasks[ti],full=st.final?20:10;
  const pr=S.progress[st.id];
  const card=el('section','card taskcard pop');
  const dots=st.tasks.map((_,j)=>{const v=pr.tasks[j];const cls=j===ti?'cur':(v===undefined?'':(v===full?'ok':(v>0?'half':'bad')));return `<i class="${cls}" title="Naloga ${j+1}"></i>`;}).join('');
  card.appendChild(el('div','taskhead',`<span class="stagetag">${st.icon} ${st.title} · naloga ${ti+1}/${st.tasks.length}</span><span class="dots">${dots}</span>`));
  let paused=false;
  if(st.final){
    const lv=el('div','levelbar',`<span class="lvl l${t.level}">${t.level}. nivo · ${['','osnova','zahtevnejše','besedilna naloga'][t.level]}</span><span class="pill">×2 točke</span>`);
    card.appendChild(lv);
    const tw=el('div','timerwrap'),tb=el('div','timer'),fill=el('i'),tl=el('span','tleft',t.time+' s');tb.appendChild(fill);
    const pb=btn('⏸ Ustavi čas','ghost small',()=>{paused=!paused;pb.textContent=paused?'▶ Nadaljuj čas':'⏸ Ustavi čas';});
    tw.append(tb,tl,pb);card.appendChild(tw);
    let left=t.time;
    TIMER=setInterval(()=>{if(paused||ctx.resolved)return;left=Math.max(0,left-0.1);fill.style.width=(left/t.time*100)+'%';tl.textContent=Math.ceil(left)+' s';if(left<=0){clearTimer();api.fail('⏰ Čas je potekel!');}},100);
  }
  card.appendChild(el('div','q',t.q));
  const area=el('div','area'),fb=el('div','fb'),expl=el('div','expl hidden'),award=el('div','award'),acts=el('div','actions');
  card.append(area,fb,expl,award,acts);
  const ctx={wrong:0,resolved:false,touched:false,reveal:[],end:[],earned:0};
  const razBtn=btn('📘 Rešitev / razlaga','violet',()=>{if(!ctx.resolved)api.fail('Rešitev je razkrita.');else showExpl();});
  razBtn.disabled=true;razBtn.title='Najprej odgovori na nalogo.';
  const nextBtn=btn(ti+1<st.tasks.length?'Naprej →':(st.final?'Zaključi finale →':'Zaključi stopnjo →'),'primary hidden',()=>{ti+1<st.tasks.length?renderTask(si,ti+1):renderSummary(si);});
  acts.append(razBtn,nextBtn);
  function showExpl(){
    const sk=t.sketch?(typeof t.sketch==='function'?t.sketch():t.sketch):'';
    expl.innerHTML=`<h3>📘 Razlaga</h3><p>${t.expl}</p>`+(sk?`<div class="fig small">${sk}</div>`:'');
    expl.classList.remove('hidden');
  }
  function finish(success,msg){
    clearTimer();
    pr.tasks[ti]=ctx.earned;pr.points=Object.values(pr.tasks).reduce((a,b)=>a+b,0);
    if(!success||ctx.wrong>0)addWrong(st.id,t.topic);
    ctx.end.forEach(f=>f());
    fb.innerHTML=success?`<div class="msg ok">✅ ${PRAISE[Math.floor(Math.random()*PRAISE.length)]} ${ctx.earned?`<b>+${ctx.earned} točk</b>`:''}${ctx.wrong&&!st.final?' (v drugem poskusu)':''}</div>`
      :`<div class="msg bad">${msg||'Tokrat ni šlo.'} Poglej pravilno rešitev in razlago.</div>`;
    beep(success?'ok':'bad');
    razBtn.disabled=false;razBtn.title='';nextBtn.classList.remove('hidden');
    if(S.mode==='class'&&ctx.earned>0){award.appendChild(el('span','',`<b>Dodeli ${ctx.earned} točk ekipi:</b>`));
      S.teams.forEach((tm,i)=>{const b=btn(`${esc(tm.name)} +${ctx.earned}`,'small',()=>{tm.score+=ctx.earned;b.disabled=true;b.classList.add('right');save();updateScorebar();beep('click');});b.style.borderColor=TEAM_COLORS[i];award.appendChild(b);});}
    save();updateScorebar();
  }
  const api={
    isResolved:()=>ctx.resolved,
    touched(){if(!ctx.touched){ctx.touched=true;razBtn.disabled=false;razBtn.title='';}},
    onReveal(fn){ctx.reveal.push(fn);},onEnd(fn){ctx.end.push(fn);},
    flash(m){fb.innerHTML=`<div class="msg info">${m}</div>`;},
    showHint(text){fb.innerHTML=`<div class="msg hint">💡 <b>Namig:</b> ${text||t.hint||'Poskusi znova.'}</div>`;},
    submit(ok){if(ctx.resolved)return;api.touched();if(ok)return api.win();ctx.wrong++;beep('bad');if(st.final||ctx.wrong>=2)return api.fail();api.showHint();},
    miss(text,silent){if(ctx.resolved)return;api.touched();ctx.wrong++;if(!silent)beep('bad');if(st.final)return api.fail();api.showHint(text);},
    win(){if(ctx.resolved)return;ctx.resolved=true;ctx.earned=ctx.wrong===0?full:(st.final?0:full/2);finish(true);},
    fail(msg){if(ctx.resolved)return;ctx.resolved=true;ctx.earned=0;ctx.reveal.forEach(f=>f());finish(false,msg);showExpl();}
  };
  TYPES[t.type](t,area,api);
  app.appendChild(card);
}
function renderSummary(si){
  const app=screen();const st=STAGES[si],pr=S.progress[st.id];pr.done=true;save();updateScorebar();beep('win');
  const c=el('section','card pop');
  const wr=S.wrong[st.id]||[];
  c.innerHTML=`<h2>💡 Del stroja prižgan: ${st.part}!</h2><div class="machine">${machineSVG()}</div>
   <p style="font-size:1.2rem">Točke v tej stopnji: <b style="color:#39ff88">${pr.points} / ${stageMax(st)}</b></p>
   <h3>🧠 Kaj si se naučil/-a</h3><ul class="learn">${st.learn.map(x=>`<li>${x}</li>`).join('')}</ul>`+
   (wr.length?`<div class="msg hint"><b>Še ponovi:</b> ${wr.join(' · ')}</div>`:`<div class="msg ok">Vse naloge pravilno v prvem poskusu – odlično!</div>`);
  const r=el('div','row end');r.style.marginTop='1rem';
  r.appendChild(btn('⟵ Na stroj','ghost',renderMap));
  r.appendChild(btn('🔁 Ponovi stopnjo','',()=>beginStage(si)));
  if(si+1<STAGES.length)r.appendChild(btn(`Naprej: ${STAGES[si+1].title} ▶`,'primary',()=>renderIntro(si+1)));
  else r.appendChild(btn('🏁 Rezultati','primary',renderEnd));
  c.appendChild(r);app.appendChild(c);
}
function renderEnd(){
  const app=screen();const tot=totalPoints(),max=maxPoints(),pct=Math.round(tot/max*100);
  const c=el('section','card pop');
  let h=`<h2>🏁 Rezultati</h2><div class="machine">${machineSVG()}</div>`;
  if(S.mode==='class'){
    const ranked=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);
    h+=`<h3>Lestvica ekip</h3><table class="res">${ranked.map((t,k)=>`<tr><td>${['🥇','🥈','🥉','4.'][k]}</td><td style="color:${TEAM_COLORS[t.i]};font-weight:800">${esc(t.name)}</td><td class="r">${t.score} točk</td></tr>`).join('')}</table>`;
  }else{
    h+=`<p class="big">${tot} / ${max} točk</p><p style="font-size:1.2rem">${pct>=85?'🌟 Svetlobni mojster! Stroj sveti s polno močjo.':pct>=60?'👍 Zelo dobro! Še malo in stroj bo deloval brezhibno.':tot>0?'💪 Dober začetek – ponovi teme spodaj in poskusi znova.':'Igraj stopnje, da prižgeš stroj.'}</p>`;
  }
  h+=`<h3>Stopnje</h3><table class="res">${STAGES.map(st=>{const pr=S.progress[st.id];return `<tr><td>${st.icon} ${st.title}</td><td>${pr&&pr.done?'✅ prižgano':(pr?'⏳ ni končano':'○ ni igrano')}</td><td class="r">${pr?pr.points:0} / ${stageMax(st)}</td></tr>`;}).join('')}</table>`;
  const topics={};STAGES.forEach(st=>(S.wrong[st.id]||[]).forEach(tp=>{(topics[tp]=topics[tp]||[]).push(st.title);}));
  const keys=Object.keys(topics);
  h+=keys.length?`<h3>📚 Teme, ki jih je treba še ponoviti</h3><ul class="learn">${keys.map(k=>`<li><b>${k}</b> <span class="muted">(${[...new Set(topics[k])].join(', ')})</span></li>`).join('')}</ul>`
     :`<div class="msg ok">Ni tem za ponavljanje – vse odigrane naloge so bile rešene v prvem poskusu.</div>`;
  c.innerHTML=h;
  const r=el('div','row end');r.style.marginTop='1rem';r.appendChild(btn('⟵ Na stroj','ghost',renderMap));r.appendChild(btn('🏠 Začetni zaslon','',renderHome));
  c.appendChild(r);app.appendChild(c);
}

/* ================= zagon ================= */
load();applyFont();updateSoundBtn();
$('#brand').addEventListener('click',renderHome);
$('#bMenu').addEventListener('click',()=>S.mode?renderMap():renderHome());
$('#bSound').addEventListener('click',()=>{S.sound=!S.sound;save();updateSoundBtn();beep('click');});
$('#bSmaller').addEventListener('click',()=>{S.fs=Math.max(0.8,Math.round((S.fs-0.1)*10)/10);applyFont();save();});
$('#bBigger').addEventListener('click',()=>{S.fs=Math.min(1.7,Math.round((S.fs+0.1)*10)/10);applyFont();save();});
$('#bFull').addEventListener('click',()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}});
updateScorebar();renderHome();
window.__LNS={STAGES,S,beginStage,renderTask,renderSummary,renderEnd,renderMap,TYPES};
</script>
</body>
</html>
